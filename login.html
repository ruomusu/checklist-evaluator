<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Checklist 评估系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 400px;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 14px;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e0e0e0;
        }
        
        .divider::before {
            left: 0;
        }
        
        .divider::after {
            right: 0;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .success {
            background: #efe;
            color: #060;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        /* 注册表单 - 默认隐藏 */
        #registerForm {
            display: none;
        }
        
        .loading {
            text-align: center;
            color: #666;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Checklist 评估系统</h1>
        <p class="subtitle">请登录以继续</p>
        
        <!-- 登录表单 -->
        <form id="loginForm">
            <div class="error" id="loginError"></div>
            <div class="success" id="loginSuccess"></div>
            
            <div class="form-group">
                <label for="loginUsername">用户名</label>
                <input type="text" id="loginUsername" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn" id="loginBtn">登录</button>
            <p class="loading" id="loginLoading">登录中...</p>
        </form>
        
        <div class="divider">或</div>
        
        <div class="links">
            <a href="#" id="showRegister">没有账号？点击注册</a>
        </div>
        
        <!-- 注册表单 -->
        <form id="registerForm">
            <div class="error" id="registerError"></div>
            <div class="success" id="registerSuccess"></div>
            
            <div class="form-group">
                <label for="registerUsername">用户名</label>
                <input type="text" id="registerUsername" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="registerPassword">密码</label>
                <input type="password" id="registerPassword" name="password" required autocomplete="new-password" minlength="6">
            </div>
            
            <div class="form-group">
                <label for="registerConfirmPassword">确认密码</label>
                <input type="password" id="registerConfirmPassword" name="confirmPassword" required autocomplete="new-password" minlength="6">
            </div>
            
            <button type="submit" class="btn" id="registerBtn">注册</button>
            <p class="loading" id="registerLoading">注册中...</p>
        </form>
        
        <div class="links" id="registerLinks" style="display: none;">
            <a href="#" id="showLogin">已有账号？点击登录</a>
        </div>
    </div>

    <script>
        const API_BASE = '';
        
        // 切换登录/注册表单
        document.getElementById('showRegister').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('registerLinks').style.display = 'block';
            document.querySelector('.subtitle').textContent = '请注册新账号';
            clearMessages();
        });
        
        document.getElementById('showLogin').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerLinks').style.display = 'none';
            document.querySelector('.subtitle').textContent = '请登录以继续';
            clearMessages();
        });
        
        function clearMessages() {
            document.querySelectorAll('.error, .success').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
        }
        
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }
        
        function showSuccess(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }
        
        // 登录
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                showError('loginError', '请填写用户名和密码');
                return;
            }
            
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginLoading').style.display = 'block';
            clearMessages();
            
            try {
                const response = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'ok') {
                    // 保存 token 和用户名
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.trainee_name);
                    localStorage.setItem('role', data.user.role);
                    
                    showSuccess('loginSuccess', '登录成功，正在跳转...');
                    
                    // 跳转到主页面
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    showError('loginError', data.detail || '登录失败');
                }
            } catch (error) {
                showError('loginError', '网络错误，请稍后重试');
                console.error(error);
            } finally {
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginLoading').style.display = 'none';
            }
        });
        
        // 注册
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            
            if (!username || !password) {
                showError('registerError', '请填写用户名和密码');
                return;
            }
            
            if (password.length < 6) {
                showError('registerError', '密码长度至少 6 位');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('registerError', '两次输入的密码不一致');
                return;
            }
            
            document.getElementById('registerBtn').disabled = true;
            document.getElementById('registerLoading').style.display = 'block';
            clearMessages();
            
            try {
                const response = await fetch(API_BASE + '/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'ok') {
                    showSuccess('registerSuccess', '注册成功，请登录');
                    
                    // 切换到登录表单
                    setTimeout(() => {
                        document.getElementById('showLogin').click();
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('loginPassword').focus();
                    }, 1000);
                } else {
                    showError('registerError', data.detail || '注册失败');
                }
            } catch (error) {
                showError('registerError', '网络错误，请稍后重试');
                console.error(error);
            } finally {
                document.getElementById('registerBtn').disabled = false;
                document.getElementById('registerLoading').style.display = 'none';
            }
        });
        
        // 检查是否已登录
        window.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (token) {
                // 已登录，跳转到主页面
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
